---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: medibook-app
  namespace: medibook
  labels:
    app: medibook
    app.kubernetes.io/name: medibook
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: medibook-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: medibook-api
        app.kubernetes.io/name: medibook
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8080"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      terminationGracePeriodSeconds: 60
      containers:
        - name: medibook
          image: us-central1-docker.pkg.dev/medibook-prod/medibook-repo/medibook-api:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            # DB — primary env var names match application-prod.yml resolution order
            - name: MEDIBOOK_DB_HOST
              valueFrom:
                secretKeyRef:
                  name: medibook-secrets
                  key: db-host
            - name: MEDIBOOK_DB_PORT
              value: "3306"
            - name: MEDIBOOK_DB_NAME
              valueFrom:
                secretKeyRef:
                  name: medibook-secrets
                  key: db-name
            - name: MEDIBOOK_DB_USER
              valueFrom:
                secretKeyRef:
                  name: medibook-secrets
                  key: db-user
            - name: MEDIBOOK_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: medibook-secrets
                  key: db-password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: medibook-secrets
                  key: jwt-secret
            - name: PHI_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: medibook-secrets
                  key: phi-encryption-key
            - name: MAIL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: medibook-secrets
                  key: mail-password
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: medibook-config
                  key: redis-host
            - name: REDIS_PORT
              value: "6379"
            - name: KAFKA_BROKERS
              valueFrom:
                configMapKeyRef:
                  name: medibook-config
                  key: kafka-brokers
            - name: CASSANDRA_HOST
              valueFrom:
                configMapKeyRef:
                  name: medibook-config
                  key: cassandra-host
            - name: CASSANDRA_PORT
              value: "9042"
            - name: CASSANDRA_KEYSPACE
              valueFrom:
                configMapKeyRef:
                  name: medibook-config
                  key: cassandra-keyspace
            - name: CASSANDRA_DATACENTER
              valueFrom:
                configMapKeyRef:
                  name: medibook-config
                  key: cassandra-datacenter
            - name: CORS_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: medibook-config
                  key: cors-origins
            - name: FRONTEND_URL
              valueFrom:
                configMapKeyRef:
                  name: medibook-config
                  key: frontend-url
            - name: SUPER_ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: medibook-secrets
                  key: super-admin-email
            - name: SUPER_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: medibook-secrets
                  key: super-admin-password
            - name: MEDIBOOK_RATE_LIMIT_TRUST_FORWARDED_HEADERS
              value: "true"
          resources:
            requests:
              memory: "768Mi"
              cpu: "250m"
            limits:
              memory: "1536Mi"
              cpu: "1000m"
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 0
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 0
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
      volumes:
        - name: tmp
          emptyDir: {}
