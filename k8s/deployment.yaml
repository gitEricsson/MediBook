---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: medibook-app
  namespace: medibook
  labels:
    app: medibook
    app.kubernetes.io/name: medibook
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: medibook-api
  progressDeadlineSeconds: 900
  minReadySeconds: 20
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 2
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: medibook-api
        app.kubernetes.io/name: medibook
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/prometheus"
        prometheus.io/port: "8080"
    spec:
      topologySpreadConstraints:
        # Best-effort spread, not a hard gate. With DoNotSchedule + maxSkew:1
        # a small cluster (or one with accumulated pods from a failed rollout)
        # can leave new pods stuck Pending forever because no node satisfies
        # the constraint — which stalls every subsequent deploy.
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: medibook-api
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: medibook-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      terminationGracePeriodSeconds: 60
      containers:
        - name: medibook
          image: us-central1-docker.pkg.dev/medibook-prod/medibook-repo/medibook-api:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            # DB — primary env var names match application-prod.yml resolution order
            - name: MEDIBOOK_DB_HOST
              valueFrom:
                secretKeyRef:
                  name: medibook-secrets
                  key: db-host
            - name: MEDIBOOK_DB_PORT
              value: "3306"
            - name: MEDIBOOK_DB_NAME
              valueFrom:
                secretKeyRef:
                  name: medibook-secrets
                  key: db-name
            - name: MEDIBOOK_DB_USER
              valueFrom:
                secretKeyRef:
                  name: medibook-secrets
                  key: db-user
            - name: MEDIBOOK_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: medibook-secrets
                  key: db-password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: medibook-secrets
                  key: jwt-secret
            - name: PHI_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: medibook-secrets
                  key: phi-encryption-key
            - name: MAIL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: medibook-secrets
                  key: mail-password
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: medibook-config
                  key: redis-host
            - name: REDIS_PORT
              value: "6379"
            - name: KAFKA_BROKERS
              valueFrom:
                configMapKeyRef:
                  name: medibook-config
                  key: kafka-brokers
            - name: KAFKA_LISTENER_AUTO_STARTUP
              valueFrom:
                configMapKeyRef:
                  name: medibook-config
                  key: kafka-listener-auto-startup
            - name: SPRING_KAFKA_LISTENER_AUTO_STARTUP
              valueFrom:
                configMapKeyRef:
                  name: medibook-config
                  key: kafka-listener-auto-startup
            - name: SPRING_KAFKA_ADMIN_FAIL_FAST
              value: "false"
            - name: CASSANDRA_HOST
              valueFrom:
                configMapKeyRef:
                  name: medibook-config
                  key: cassandra-host
            - name: CASSANDRA_PORT
              value: "9042"
            - name: CASSANDRA_KEYSPACE
              valueFrom:
                configMapKeyRef:
                  name: medibook-config
                  key: cassandra-keyspace
            - name: CASSANDRA_DATACENTER
              valueFrom:
                configMapKeyRef:
                  name: medibook-config
                  key: cassandra-datacenter
            - name: CORS_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: medibook-config
                  key: cors-origins
            - name: FRONTEND_URL
              valueFrom:
                configMapKeyRef:
                  name: medibook-config
                  key: frontend-url
            - name: SUPER_ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: medibook-secrets
                  key: super-admin-email
            - name: SUPER_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: medibook-secrets
                  key: super-admin-password
            # ─── Mail (SMTP) ──────────────────────────────────────────
            - name: MAIL_HOST
              valueFrom:
                configMapKeyRef:
                  name: medibook-config
                  key: mail-host
            - name: MAIL_PORT
              valueFrom:
                configMapKeyRef:
                  name: medibook-config
                  key: mail-port
            - name: MAIL_SMTP_AUTH
              valueFrom:
                configMapKeyRef:
                  name: medibook-config
                  key: mail-smtp-auth
            - name: MAIL_SMTP_STARTTLS_ENABLE
              valueFrom:
                configMapKeyRef:
                  name: medibook-config
                  key: mail-smtp-starttls-enable
            - name: MAIL_FROM_ADDRESS
              valueFrom:
                configMapKeyRef:
                  name: medibook-config
                  key: mail-from-address
            - name: MAIL_FROM_NAME
              valueFrom:
                configMapKeyRef:
                  name: medibook-config
                  key: mail-from-name
            - name: MAIL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: medibook-secrets
                  key: mail-username
            # ─── Payments — Paystack / Monnify / Stripe ───────────────
            - name: PAYSTACK_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: medibook-config
                  key: paystack-enabled
            - name: PAYSTACK_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: medibook-config
                  key: paystack-base-url
            - name: PAYSTACK_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: medibook-secrets
                  key: paystack-secret-key
            - name: MONNIFY_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: medibook-config
                  key: monnify-enabled
            - name: MONNIFY_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: medibook-config
                  key: monnify-base-url
            - name: MONNIFY_REDIRECT_URL
              valueFrom:
                configMapKeyRef:
                  name: medibook-config
                  key: monnify-redirect-url
            - name: MONNIFY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: medibook-secrets
                  key: monnify-api-key
            - name: MONNIFY_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: medibook-secrets
                  key: monnify-secret-key
            - name: MONNIFY_CONTRACT_CODE
              valueFrom:
                secretKeyRef:
                  name: medibook-secrets
                  key: monnify-contract-code
            - name: STRIPE_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: medibook-config
                  key: stripe-enabled
            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: medibook-secrets
                  key: stripe-secret-key
            - name: STRIPE_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: medibook-secrets
                  key: stripe-webhook-secret
            # ─── AI / NLP / Telemedicine ──────────────────────────────
            - name: AI_SUPPORT_PROVIDER
              valueFrom:
                configMapKeyRef:
                  name: medibook-config
                  key: ai-support-provider
            - name: AI_CHAT_PROVIDER
              valueFrom:
                configMapKeyRef:
                  name: medibook-config
                  key: ai-chat-provider
            - name: AI_CHAT_BAA_ACTIVE
              valueFrom:
                configMapKeyRef:
                  name: medibook-config
                  key: ai-chat-baa-active
            - name: INTELLIGENCE_NLP_PROVIDER
              valueFrom:
                configMapKeyRef:
                  name: medibook-config
                  key: intelligence-nlp-provider
            - name: TELEMEDICINE_PROVIDER
              valueFrom:
                configMapKeyRef:
                  name: medibook-config
                  key: telemedicine-provider
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: medibook-secrets
                  key: gemini-api-key
            - name: CLAUDE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: medibook-secrets
                  key: claude-api-key
            - name: TWILIO_ACCOUNT_SID
              valueFrom:
                secretKeyRef:
                  name: medibook-secrets
                  key: twilio-account-sid
            - name: TWILIO_API_KEY_SID
              valueFrom:
                secretKeyRef:
                  name: medibook-secrets
                  key: twilio-api-key-sid
            - name: TWILIO_API_KEY_SECRET
              valueFrom:
                secretKeyRef:
                  name: medibook-secrets
                  key: twilio-api-key-secret
            - name: MEDIBOOK_RATE_LIMIT_TRUST_FORWARDED_HEADERS
              value: "true"
            - name: MANAGEMENT_TRACING_ENABLED
              value: "false"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: medibook-config
                  key: otel-endpoint
            - name: TRACING_SAMPLING_PROBABILITY
              valueFrom:
                configMapKeyRef:
                  name: medibook-config
                  key: tracing-sampling-probability
            - name: TZ
              valueFrom:
                configMapKeyRef:
                  name: medibook-config
                  key: time-zone
            - name: JAVA_TOOL_OPTIONS
              value: "-Duser.timezone=$(TZ)"
          resources:
            requests:
              memory: "768Mi"
              cpu: "250m"
            limits:
              memory: "1536Mi"
              cpu: "1000m"
          startupProbe:
            httpGet:
              path: /health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 18
          livenessProbe:
            httpGet:
              path: /health/liveness
              port: 8080
            initialDelaySeconds: 0
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: 8080
            initialDelaySeconds: 0
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
      volumes:
        - name: tmp
          emptyDir: {}
