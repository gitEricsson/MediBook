name: Backend CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - master
      - develop

jobs:
  test:
    name: Run Backend Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        ports:
          - 3306:3306
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: medibook
          MYSQL_USER: medibook
          MYSQL_PASSWORD: medibook
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7
        ports:
          - 6379:6379

      zookeeper:
        image: bitnami/zookeeper:3.9
        ports:
          - 2181:2181
        env:
          ALLOW_ANONYMOUS_LOGIN: yes

      kafka:
        image: bitnami/kafka:3.7
        ports:
          - 9092:9092
        env:
          KAFKA_CFG_ZOOKEEPER_CONNECT: zookeeper:2181
          ALLOW_PLAINTEXT_LISTENER: yes
          KAFKA_CFG_LISTENERS: PLAINTEXT://:9092
          KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
        options: >-
          --health-cmd="kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"
          --health-interval=15s
          --health-timeout=10s
          --health-retries=10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Run tests
        env:
          SPRING_PROFILES_ACTIVE: test

          DB_HOST: localhost
          DB_PORT: 3306
          DB_NAME: medibook
          DB_USER: medibook
          DB_PASSWORD: medibook

          REDIS_HOST: localhost
          REDIS_PORT: 6379

          KAFKA_BROKERS: localhost:9092

          JWT_SECRET: testtesttesttesttesttesttesttesttesttesttesttesttest
          PHI_ENCRYPTION_KEY: 12345678901234567890123456789012

        run: |
          mvn clean verify