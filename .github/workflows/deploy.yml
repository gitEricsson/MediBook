name: Backend Deploy

on:
  push:
    branches:
      - master

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GKE_CLUSTER: ${{ secrets.GKE_CLUSTER }}
  GKE_ZONE: ${{ secrets.GKE_ZONE }}
  GAR_LOCATION: us-central1
  REPOSITORY: medibook-repo
  IMAGE: medibook-api

jobs:
  build-and-push:
    name: Build, Scan & Push Docker Image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write
      security-events: write   # for SARIF upload

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker $GAR_LOCATION-docker.pkg.dev --quiet

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build JAR (tests run in CI workflow — artifact reuse via cache)
        run: |
          mvn clean package -DskipTests

      - name: Build Docker image
        run: |
          docker build \
            -t $GAR_LOCATION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$IMAGE:${{ github.sha }} \
            -t $GAR_LOCATION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$IMAGE:latest \
            .

      - name: Scan image with Trivy (CRITICAL + HIGH)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ github.sha }}"
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          ignore-unfixed: true

      - name: Upload Trivy SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      - name: Push Docker image
        run: |
          docker push $GAR_LOCATION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$IMAGE:${{ github.sha }}
          docker push $GAR_LOCATION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$IMAGE:latest

  deploy:
    name: Deploy to GKE
    runs-on: ubuntu-latest
    needs: build-and-push

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Install GKE auth plugin
        run: |
          gcloud components install gke-gcloud-auth-plugin --quiet

      - name: Configure kubectl
        run: |
          gcloud container clusters get-credentials $GKE_CLUSTER \
            --zone $GKE_ZONE \
            --project $PROJECT_ID

      - name: Deploy to Kubernetes
        run: |
          kubectl set image deployment/medibook-app \
            medibook=$GAR_LOCATION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$IMAGE:${{ github.sha }} \
            -n medibook

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/medibook-app \
            -n medibook \
            --timeout=300s

      - name: Smoke test — health endpoint
        id: smoke
        run: |
          # Resolve the internal service ClusterIP; use kubectl port-forward for a quick check.
          kubectl port-forward svc/medibook-service 18080:80 -n medibook &
          PF_PID=$!
          sleep 5

          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            http://localhost:18080/actuator/health/readiness --max-time 10)

          kill $PF_PID 2>/dev/null || true

          echo "status=$HTTP_STATUS" >> "$GITHUB_OUTPUT"
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "::error::Smoke test failed — readiness probe returned HTTP $HTTP_STATUS"
            exit 1
          fi
          echo "Smoke test passed (HTTP $HTTP_STATUS)"

      - name: Rollback on failure
        if: failure() && steps.smoke.outcome == 'failure'
        run: |
          echo "::warning::Smoke test failed — rolling back deployment"
          kubectl rollout undo deployment/medibook-app -n medibook
          kubectl rollout status deployment/medibook-app -n medibook --timeout=120s
          echo "::error::Deployment rolled back due to failed smoke test"
          exit 1
