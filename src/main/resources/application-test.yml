spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.cassandra.CassandraAutoConfiguration
      - org.springframework.boot.autoconfigure.data.cassandra.CassandraDataAutoConfiguration
      - org.springframework.boot.autoconfigure.data.cassandra.CassandraRepositoriesAutoConfiguration

  datasource:
    url: jdbc:h2:mem:medibook_it;MODE=MySQL;DATABASE_TO_UPPER=false;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  flyway:
    enabled: false

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    show-sql: false

  data:
    cassandra:
      contact-points: localhost
      port: 9042
      keyspace-name: medibook
      local-datacenter: datacenter1
      schema-action: RECREATE
    redis:
      host: localhost
      port: 6379

  kafka:
    bootstrap-servers: localhost:9092
    listener:
      auto-startup: false
    admin:
      fail-fast: false

  mail:
    host: localhost
    port: 1025
    username: test@medibook.local
    password: test

app:
  jwt:
    secret: test-jwt-secret-for-medibook-integration-testing-secure-key-256bits
    access-token-expiration-ms: 900000
    refresh-token-expiration-ms: 604800000
  phi:
    encryption-key: medibook-phi-aes256-encryption-key!

medibook:
  rate-limit:
    enabled: false

logging:
  level:
    com.medibook: DEBUG

management:
  endpoint:
    health:
      validate-group-membership: false
