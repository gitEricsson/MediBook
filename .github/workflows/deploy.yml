name: Backend Deploy

on:
  workflow_run:
    workflows: ["Backend CI"]
    branches: [master]
    types: [completed]

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GKE_CLUSTER: ${{ secrets.GKE_CLUSTER }}
  GKE_ZONE: ${{ secrets.GKE_ZONE }}
  GAR_LOCATION: us-central1
  REPOSITORY: medibook-repo
  IMAGE: medibook-api

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker $GAR_LOCATION-docker.pkg.dev --quiet

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build JAR
        run: |
          mvn clean package -DskipTests

      - name: Build Docker image
        run: |
          docker build \
            -t $GAR_LOCATION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$IMAGE:${{ github.sha }} \
            -t $GAR_LOCATION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$IMAGE:latest \
            .

      - name: Push Docker image
        run: |
          docker push $GAR_LOCATION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$IMAGE:${{ github.sha }}
          docker push $GAR_LOCATION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$IMAGE:latest

  deploy:
    name: Deploy to GKE
    runs-on: ubuntu-latest
    needs: build-and-push

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Install GKE auth plugin
        run: |
          gcloud components install gke-gcloud-auth-plugin --quiet

      - name: Configure kubectl
        run: |
          gcloud container clusters get-credentials $GKE_CLUSTER \
            --zone $GKE_ZONE \
            --project $PROJECT_ID

      - name: Deploy to Kubernetes
        run: |
          kubectl set image deployment/medibook-app \
            medibook=$GAR_LOCATION-docker.pkg.dev/$PROJECT_ID/$REPOSITORY/$IMAGE:${{ github.sha }} \
            -n medibook

      - name: Wait for rollout
        run: |
          # 600s — the app's startup is slow (Kafka attach, Cassandra session,
          # Hikari pool warmup, Redis listener). A 4-pod rolling restart with
          # maxSurge=1 / maxUnavailable=25% takes ~6 min total in practice.
          kubectl rollout status deployment/medibook-app \
            -n medibook \
            --timeout=600s

      - name: Verify new ReplicaSet is healthy
        run: |
          set -e
          RS=$(kubectl get rs -n medibook -l app=medibook \
            --sort-by=.metadata.creationTimestamp \
            -o jsonpath='{.items[-1:].metadata.name}')
          echo "Newest ReplicaSet: $RS"
          HASH=$(echo $RS | awk -F- '{print $NF}')

          # Wait 30s for pods to settle past the initial liveness-probe window.
          # The app takes ~90s to fully warm up (Kafka attach, Cassandra session,
          # Hikari pool), and a single restart during that window is expected.
          sleep 30

          # Crash-loop indicator: restart count >= 3 OR pod not Ready.
          # A single restart during slow startup is acceptable.
          BAD=$(kubectl get pods -n medibook -l pod-template-hash=$HASH \
            -o jsonpath='{range .items[*]}{.metadata.name}{" "}{.status.containerStatuses[0].restartCount}{" "}{.status.containerStatuses[0].ready}{"\n"}{end}' \
            | awk '$2 >= 3 || $3 != "true" {print}')
          if [ -n "$BAD" ]; then
            echo "::error::New pods unhealthy (crash-looping or not ready):"
            echo "$BAD"
            kubectl rollout undo deployment/medibook-app -n medibook
            exit 1
          fi
          echo "All new pods are Ready (restarts < 3, allowed for slow startup)."