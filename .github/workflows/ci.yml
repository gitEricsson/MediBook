name: Backend CI

on:
  push:
    branches:
      - master
      - main
      - develop
  pull_request:
    branches:
      - master
      - main
      - develop

jobs:
  test:
    name: Run Backend Tests
    runs-on: ubuntu-latest

    # security-events:write lets `github/codeql-action/upload-sarif` post the
    # OWASP Dependency-Check SARIF to the Security tab. Without it the upload
    # step fails with "Resource not accessible by integration" and takes the
    # whole job down even though the tests themselves passed.
    permissions:
      contents: read
      security-events: write

    services:
      mysql:
        image: mysql:8.0
        ports:
          - 3306:3306
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: medibook
          MYSQL_USER: medibook
          MYSQL_PASSWORD: medibook
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7
        ports:
          - 6379:6379

      # Kafka in KRaft mode — no separate ZooKeeper container.
      # `bitnami/zookeeper` images were removed from Docker Hub when Bitnami
      # changed their distribution model, so the older ZK+Kafka pair no
      # longer works. KRaft is the modern Kafka deployment anyway.
      kafka:
        image: apache/kafka:3.7.0
        ports:
          - 9092:9092
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
          CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
        options: >-
          --health-cmd="/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"
          --health-interval=15s
          --health-timeout=10s
          --health-retries=10
          --health-start-period=30s

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Run tests
        env:
          SPRING_PROFILES_ACTIVE: test

          DB_HOST: localhost
          DB_PORT: 3306
          DB_NAME: medibook
          DB_USER: medibook
          DB_PASSWORD: medibook

          REDIS_HOST: localhost
          REDIS_PORT: 6379

          KAFKA_BROKERS: localhost:9092

          JWT_SECRET: testtesttesttesttesttesttesttesttesttesttesttesttest
          PHI_ENCRYPTION_KEY: 12345678901234567890123456789012

        run: |
          mvn clean verify

      - name: OWASP Dependency-Check (SCA)
        # Run even when the preceding test step fails — security scan output
        # is most useful exactly when something is already off. Without
        # `if: always()` a failed test phase skips OWASP entirely, which is
        # also why the SARIF upload step then can't find the report.
        if: always()
        run: |
          # -DsarifOutputDirectory is NOT a recognized property of the
          # dependency-check-maven plugin and was being silently ignored,
          # which is why the upload step couldn't find the report. The
          # canonical property is -DodcOutputDirectory; we let it use the
          # default target/ and point the upload step there explicitly.
          mvn org.owasp:dependency-check-maven:check \
            -DfailBuildOnCVSS=7 \
            -DsuppressionFile=.owasp-suppressions.xml \
            -Dformat=SARIF
        continue-on-error: true

      - name: Upload Dependency-Check SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: target/dependency-check-report.sarif
          category: owasp-dependency-check

  image-scan:
    name: Container Image Scan (Trivy)
    runs-on: ubuntu-latest
    needs: test

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build JAR for image scan
        run: mvn clean package -DskipTests -q

      - name: Build Docker image (scan target)
        run: docker build -t medibook-api:scan .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "medibook-api:scan"
          format: "sarif"
          output: "trivy-backend-results.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: "0"
          ignore-unfixed: true

      - name: Upload Trivy SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-backend-results.sarif