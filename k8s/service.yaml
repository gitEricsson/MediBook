---
apiVersion: v1
kind: Service
metadata:
  name: medibook-service
  namespace: medibook
spec:
  selector:
    app: medibook
  type: ClusterIP
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: medibook-ingress
  namespace: medibook
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  rules:
    - host: api.medibook.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: medibook-service
                port:
                  number: 80
  tls:
    - hosts:
        - api.medibook.com
      secretName: medibook-tls
