server:
  shutdown: graceful
  tomcat:
    max-http-form-post-size: 10MB
    max-swallow-size: 10MB

spring:
  application:
    name: medibook

  jackson:
    serialization:
      write-dates-as-timestamps: false

  lifecycle:
    timeout-per-shutdown-phase: 30s

  # ─── Request Size Limits ───────────────────────────────────────────────────
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

  cassandra:
    request:
      timeout: ${CASSANDRA_REQUEST_TIMEOUT:15s}

  # ─── Java 21 Virtual Threads ────────────────────────────────────────────
  threads:
    virtual:
      enabled: true

  # ─── MySQL / HikariCP ───────────────────────────────────────────────────
  datasource:
    url: jdbc:mysql://${MEDIBOOK_DB_HOST:${DB_HOST:localhost}}:${MEDIBOOK_DB_PORT:${DB_PORT:3306}}/${MEDIBOOK_DB_NAME:${DB_NAME:medibook}}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${MEDIBOOK_DB_USER:${DB_USER:medibook}}
    password: ${MEDIBOOK_DB_PASSWORD:${DB_PASSWORD:medibook}}
    hikari:
      pool-name: MediBook-HikariCP
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 600000
      connection-timeout: 30000
      max-lifetime: 1800000
      leak-detection-threshold: ${DB_LEAK_DETECTION_THRESHOLD_MS:15000}
      register-mbeans: true

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        default_batch_fetch_size: 25

  # ─── Flyway ─────────────────────────────────────────────────────────────
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  # ─── Cassandra ──────────────────────────────────────────────────────────
  data:
    cassandra:
      repositories:
        type: none
      keyspace-name: ${CASSANDRA_KEYSPACE:medibook}
      contact-points: ${CASSANDRA_HOST:localhost}
      port: ${CASSANDRA_PORT:9042}
      local-datacenter: ${CASSANDRA_DATACENTER:datacenter1}
      username: ${CASSANDRA_USER:cassandra}
      password: ${CASSANDRA_PASSWORD:cassandra}
      schema-action: CREATE_IF_NOT_EXISTS
    redis:
      repositories:
        enabled: false
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 1000ms

  # ─── Kafka ──────────────────────────────────────────────────────────────
  kafka:
    bootstrap-servers: ${MEDIBOOK_KAFKA_BROKERS:${KAFKA_BROKERS:localhost:9092}}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      retries: 3
      properties:
        spring.json.add.type.headers: false
        acks: all
        enable.idempotence: true
    consumer:
      group-id: medibook-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.medibook.messaging.event"
    listener:
      ack-mode: MANUAL_IMMEDIATE
      concurrency: 3

  # ─── Email ──────────────────────────────────────────────────────────────
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:true}

# ─── Twilio Conversations ───────────────────────────────────────────────────
twilio:
  account-sid: ${TWILIO_ACCOUNT_SID:}
  auth-token: ${TWILIO_AUTH_TOKEN:}
  conversations:
    service-sid: ${TWILIO_CONVERSATIONS_SERVICE_SID:}

# ─── JWT ────────────────────────────────────────────────────────────────────
app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration-ms: 900000        # 15 min
    refresh-token-expiration-ms: 604800000    # 7 days
  security:
    https-redirect: ${HTTPS_REDIRECT:false}    # Redirect HTTP to HTTPS (production only)
    session:
      timeout-minutes: 30                      # Session inactivity timeout
      refresh-token-rotation-enabled: true     # Enable token rotation on refresh
      max-active-tokens: 5                     # Max concurrent sessions per user
    encryption-key: ${FIELD_ENCRYPTION_KEY:0123456789abcdef0123456789abcdef}
  otp:
    expiration-minutes: 5
    length: 6
  phi:
    encryption-key: ${PHI_ENCRYPTION_KEY}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:4200,http://127.0.0.1:4200,http://localhost:5173,http://127.0.0.1:5173}
    include-local-dev-origins: ${CORS_INCLUDE_LOCAL_DEV_ORIGINS:true}
  frontend:
    url: ${FRONTEND_URL:http://localhost:3000}
  mail:
    from-address: ${MAIL_FROM_ADDRESS:${spring.mail.username:noreply@medibook.local}}
    from-name: ${MAIL_FROM_NAME:MediBook}
    failover-enabled: ${APP_MAIL_FAILOVER_ENABLED:true}
    brevo:
      enabled: ${BREVO_ENABLED:false}
      api-key: ${BREVO_API_KEY:}
      base-url: ${BREVO_BASE_URL:https://api.brevo.com}
  bootstrap:
    super-admin:
      email: ${SUPER_ADMIN_EMAIL:}
      password: ${SUPER_ADMIN_PASSWORD:}
      first-name: ${SUPER_ADMIN_FIRST_NAME:Super}
      last-name: ${SUPER_ADMIN_LAST_NAME:Admin}
      phone: ${SUPER_ADMIN_PHONE:}
  payment:
    paystack:
      enabled: ${PAYSTACK_ENABLED:true}
      secret-key: ${PAYSTACK_SECRET_KEY:}
      base-url: ${PAYSTACK_BASE_URL:https://api.paystack.co}
    flutterwave:
      enabled: ${FLUTTERWAVE_ENABLED:false}
      secret-key: ${FLUTTERWAVE_SECRET_KEY:}
      base-url: https://api.flutterwave.com/v3
    stripe:
      enabled: ${STRIPE_ENABLED:false}
      secret-key: ${STRIPE_SECRET_KEY:}
      webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    monnify:
      enabled: ${MONNIFY_ENABLED:false}
      api-key: ${MONNIFY_API_KEY:}
      secret-key: ${MONNIFY_SECRET_KEY:}
      contract-code: ${MONNIFY_CONTRACT_CODE:}
      # Sandbox: https://sandbox.monnify.com  |  Live: https://api.monnify.com
      base-url: ${MONNIFY_BASE_URL:https://sandbox.monnify.com}
      redirect-url: ${MONNIFY_REDIRECT_URL:http://localhost:3000/payment/callback}
  hospital:
    # Fallback / default base fee when a doctor's specialization is not listed below.
    consultation-fee: ${HOSPITAL_CONSULTATION_FEE:5000.00}
    experience-premium-percent: ${HOSPITAL_EXPERIENCE_PREMIUM_PERCENT:20}
    experience-threshold-years: ${HOSPITAL_EXPERIENCE_THRESHOLD_YEARS:10}
    # Specialization base fees (NGN). Senior premium is layered on top automatically.
    # Override individual entries via env e.g. HOSPITAL_FEE_CARDIOLOGY, or change config and redeploy.
    specialization-fees:
      Cardiology:           ${HOSPITAL_FEE_CARDIOLOGY:15000}
      Neurology:            ${HOSPITAL_FEE_NEUROLOGY:18000}
      Orthopedics:          ${HOSPITAL_FEE_ORTHOPEDICS:12000}
      Oncology:             ${HOSPITAL_FEE_ONCOLOGY:20000}
      Dermatology:          ${HOSPITAL_FEE_DERMATOLOGY:8000}
      Pediatrics:           ${HOSPITAL_FEE_PEDIATRICS:7000}
      Psychiatry:           ${HOSPITAL_FEE_PSYCHIATRY:10000}
      # Spring binds Map keys exactly as written, so multi-word keys are written without
      # spaces (we match case-insensitively and on substrings so this is enough).
      Obgyn:                ${HOSPITAL_FEE_OBGYN:12000}
      Gynecology:           ${HOSPITAL_FEE_GYNECOLOGY:12000}
      Obstetrics:           ${HOSPITAL_FEE_OBSTETRICS:12000}
      Emergency:            ${HOSPITAL_FEE_EMERGENCY:9000}
      Internal:             ${HOSPITAL_FEE_INTERNAL_MED:7000}
      Family:               ${HOSPITAL_FEE_FAMILY_MED:6000}
      Practice:             ${HOSPITAL_FEE_GP:5000}
      General:              ${HOSPITAL_FEE_GENERAL:6000}
      Ophthalmology:        ${HOSPITAL_FEE_OPHTHALMOLOGY:10000}
      ENT:                  ${HOSPITAL_FEE_ENT:9000}
      Urology:              ${HOSPITAL_FEE_UROLOGY:11000}
      Endocrinology:        ${HOSPITAL_FEE_ENDOCRINOLOGY:11000}
      Gastroenterology:     ${HOSPITAL_FEE_GASTRO:12000}
      Radiology:            ${HOSPITAL_FEE_RADIOLOGY:9000}
      Pathology:            ${HOSPITAL_FEE_PATHOLOGY:7000}
  chat:
    baa-active: ${AI_CHAT_BAA_ACTIVE:false}   # Set true ONLY after BAA is executed with Twilio and AI provider

  ai:
    support:
      # Provider options: stub (default, no AI) | ollama (local) | claude-api (remote)
      provider: ${AI_SUPPORT_PROVIDER:stub}
      max-tokens: ${AI_SUPPORT_MAX_TOKENS:512}
      ollama:
        base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
        model: ${OLLAMA_MODEL:llama3.1}
        timeout-seconds: ${OLLAMA_TIMEOUT_SECONDS:30}

  intelligence:
    nlp-provider: ${INTELLIGENCE_NLP_PROVIDER:stub}
    claude-api:
      key: ${CLAUDE_API_KEY:}
      max-tokens: 512
  telemedicine:
    provider: ${TELEMEDICINE_PROVIDER:stub}
    daily-co:
      api-key: ${DAILY_CO_API_KEY:}
    twilio:
      account-sid: ${TWILIO_ACCOUNT_SID:}
      auth-token: ${TWILIO_AUTH_TOKEN:}
      api-key-sid: ${TWILIO_API_KEY_SID:${TWILIO_API_KEY:}}
      api-key-secret: ${TWILIO_API_KEY_SECRET:${TWILIO_API_SECRET:}}
      video-room-type: ${TWILIO_VIDEO_ROOM_TYPE:group}
      video-token-ttl-seconds: ${TWILIO_VIDEO_TOKEN_TTL_SECONDS:900}
      video-status-callback-url: ${TWILIO_VIDEO_STATUS_CALLBACK_URL:}
  api-docs:
    enabled: ${OPENAPI_ENABLED:false}
  storage:
    type: ${STORAGE_TYPE:local}
    local:
      path: ${STORAGE_LOCAL_PATH:./uploads}
      base-url: ${STORAGE_BASE_URL:http://localhost:8080}
    s3:
      bucket: ${AWS_S3_BUCKET:medibook-avatars}
      region: ${AWS_REGION:us-east-1}
  notification:
    retry:
      max-attempts: 3
      initial-delay-ms: 1000
      multiplier: 2.0
      max-delay-ms: 10000

# ─── Resilience4j ───────────────────────────────────────────────────────────
resilience4j:
  bulkhead:
    instances:
      appointmentService:
        max-concurrent-calls: 20
        max-wait-duration: 500ms
      patientService:
        max-concurrent-calls: 15
        max-wait-duration: 500ms
      doctorService:
        max-concurrent-calls: 15
        max-wait-duration: 500ms
      notificationService:
        max-concurrent-calls: 30
        max-wait-duration: 200ms
  thread-pool-bulkhead:
    instances:
      reportService:
        max-thread-pool-size: 4
        core-thread-pool-size: 2
        queue-capacity: 10
  rate-limiter:
    instances:
      authEndpoint:
        limit-for-period: 5
        limit-refresh-period: 1m
        timeout-duration: 0s
      apiEndpoint:
        limit-for-period: 100
        limit-refresh-period: 1m
        timeout-duration: 0s
      aiChatEndpoint:
        limit-for-period: 20
        limit-refresh-period: 1m
        timeout-duration: 0s
  circuit-breaker:
    instances:
      paymentProvider:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        record-exceptions:
          - java.io.IOException
          - java.net.ConnectException
          - java.net.SocketTimeoutException
          - com.medibook.common.exception.TemporaryFailureException
      emailService:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 60
        wait-duration-in-open-state: 60s
        permitted-number-of-calls-in-half-open-state: 2
      externalApi:
        sliding-window-type: TIME_BASED
        sliding-window-size: 60
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 45s
        permitted-number-of-calls-in-half-open-state: 5
      kafkaProducer:
        failure-rate-threshold: 50
        slow-call-rate-threshold: 80
        slow-call-duration-threshold: 3s
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 5
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
      cassandraWrite:
        failure-rate-threshold: 50
        wait-duration-in-open-state: 20s
        sliding-window-size: 10
      paystackProvider:
        failure-rate-threshold: 50
        slow-call-duration-threshold: 5s
        wait-duration-in-open-state: 60s
        sliding-window-size: 10
        permitted-number-of-calls-in-half-open-state: 3
      flutterwaveProvider:
        failure-rate-threshold: 50
        slow-call-duration-threshold: 5s
        wait-duration-in-open-state: 60s
        sliding-window-size: 10
        permitted-number-of-calls-in-half-open-state: 3
      stripeProvider:
        failure-rate-threshold: 50
        slow-call-duration-threshold: 5s
        wait-duration-in-open-state: 60s
        sliding-window-size: 10
        permitted-number-of-calls-in-half-open-state: 3
      monnifyProvider:
        failure-rate-threshold: 50
        slow-call-duration-threshold: 8s
        wait-duration-in-open-state: 60s
        sliding-window-size: 10
        permitted-number-of-calls-in-half-open-state: 3
      videoRoomProvider:
        failure-rate-threshold: 60
        wait-duration-in-open-state: 30s
        sliding-window-size: 5
      clinicalNlpProvider:
        failure-rate-threshold: 60
        slow-call-duration-threshold: 10s
        wait-duration-in-open-state: 120s
        sliding-window-size: 5
      ollamaProvider:
        failure-rate-threshold: 50
        slow-call-duration-threshold: 15s
        wait-duration-in-open-state: 60s
        sliding-window-size: 5
        permitted-number-of-calls-in-half-open-state: 2

# ─── Springdoc / Swagger ────────────────────────────────────────────────────
springdoc:
  api-docs:
    enabled: ${app.api-docs.enabled:false}
    path: /api-docs
  swagger-ui:
    enabled: ${app.api-docs.enabled:false}
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

# ─── Actuator / Prometheus ──────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
      base-path: /
  endpoint:
    health:
      show-details: when-authorized
      show-components: always
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,redis
        liveness:
          include: livenessState
      liveness-state:
        enabled: true
      readiness-state:
        enabled: true
    prometheus:
      enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 50ms,100ms,200ms,500ms,1s
    tags:
      application: medibook
      env: ${spring.profiles.active:default}
    export:
      prometheus:
        enabled: true

# ─── Logging ────────────────────────────────────────────────────────────────
logging:
  level:
    com.medibook: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [%X{correlationId:-}] %logger{36} - %msg%n"
