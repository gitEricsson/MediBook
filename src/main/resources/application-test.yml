spring:
  cassandra:
    request:
      timeout: 15s

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.cassandra.CassandraAutoConfiguration
      - org.springframework.boot.autoconfigure.data.cassandra.CassandraDataAutoConfiguration
      - org.springframework.boot.autoconfigure.data.cassandra.CassandraRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration


  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  flyway:
    enabled: false

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    show-sql: false

  data:
    cassandra:
      repositories:
        type: none
      contact-points: localhost
      port: 9042
      keyspace-name: medibook
      local-datacenter: datacenter1
      schema-action: RECREATE
    redis:
      repositories:
        enabled: false
      host: localhost
      port: 6379

  kafka:
    bootstrap-servers: localhost:9092
    listener:
      auto-startup: false
    admin:
      fail-fast: false

  mail:
    host: localhost
    port: 1025

app:
  jwt:
    secret: test-jwt-secret-for-medibook-integration-testing-secure-key-256bits
    access-token-expiration-ms: 900000
    refresh-token-expiration-ms: 604800000
  phi:
    encryption-key: medibook-phi-aes256-encryption-key!
  bootstrap:
    super-admin:
      email: superadmin@medibook.test
      password: SuperAdminTest1!
      first-name: Super
      last-name: Admin

medibook:
  jobs:
    enabled: false
  rate-limit:
    enabled: false

logging:
  level:
    com.medibook: DEBUG

management:
  endpoint:
    health:
      validate-group-membership: false
