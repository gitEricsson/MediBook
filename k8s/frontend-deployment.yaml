---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: medibook-fe
  namespace: medibook
  labels:
    app: medibook-fe
    app.kubernetes.io/component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: medibook-fe
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: medibook-fe
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101   # nginx default user
      terminationGracePeriodSeconds: 30
      containers:
        - name: medibook-fe
          image: REGISTRY/medibook-fe:TAG
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
      volumes:
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: medibook-fe-service
  namespace: medibook
  labels:
    app: medibook-fe
spec:
  selector:
    app: medibook-fe
  type: ClusterIP
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: medibook-fe-ingress
  namespace: medibook
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "5m"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";
    nginx.ingress.kubernetes.io/server-snippet: |
      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  rules:
    - host: app.medibook.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: medibook-fe-service
                port:
                  number: 80
  tls:
    - hosts:
        - app.medibook.com
      secretName: medibook-fe-tls
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: medibook-fe-pdb
  namespace: medibook
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: medibook-fe
