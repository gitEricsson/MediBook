name: Deploy to GKE

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      image_tag:
        description: 'Image tag to deploy (e.g. sha-abc1234)'
        required: true
  push:
    branches:
      - main
      - master
    paths:
      - 'k8s/**'

concurrency:
  group: medibook-deploy-${{ github.event.inputs.environment || 'staging' }}
  cancel-in-progress: false

env:
  REGISTRY: gcr.io/${{ vars.GCP_PROJECT_ID }}
  IMAGE_NAME: medibook-api
  GKE_CLUSTER: ${{ vars.GKE_CLUSTER_NAME }}
  GKE_ZONE: ${{ vars.GKE_ZONE }}

jobs:
  deploy:
    name: Deploy ${{ github.event.inputs.environment || 'staging' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ github.event.inputs.environment || 'staging' }}
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_ZONE }}

      - name: Determine image tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.image_tag }}" ]; then
            echo "tag=${{ github.event.inputs.image_tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=sha-$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT
          fi

      - name: Apply namespace and config
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/configmap.yaml

      - name: Deploy backend
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}"
          kubectl set image deployment/medibook-app medibook="${IMAGE}" -n medibook
          kubectl rollout status deployment/medibook-app -n medibook --timeout=300s

      - name: Apply HPA, PDB, Network Policies
        run: |
          kubectl apply -f k8s/hpa.yaml
          kubectl apply -f k8s/poddisruptionbudget.yaml
          kubectl apply -f k8s/networkpolicy.yaml
          kubectl apply -f k8s/service.yaml

      - name: Verify deployment health
        run: |
          kubectl get pods -n medibook -l app=medibook
          kubectl rollout status deployment/medibook-app -n medibook

      - name: Smoke test
        run: |
          API_URL=$(kubectl get ingress medibook-ingress -n medibook -o jsonpath='{.spec.rules[0].host}')
          for i in {1..6}; do
            if curl -fsS "https://${API_URL}/actuator/health" | grep -q '"status":"UP"'; then
              echo "Smoke test passed"
              exit 0
            fi
            sleep 10
          done
          echo "Smoke test failed" >&2
          exit 1
