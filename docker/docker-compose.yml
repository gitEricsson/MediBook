services:

  # ─── Application ──────────────────────────────────────────────────────────
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: medibook-app
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: medibook
      DB_USER: medibook
      DB_PASSWORD: medibook
      CASSANDRA_HOST: cassandra
      CASSANDRA_PORT: 9042
      CASSANDRA_KEYSPACE: medibook
      CASSANDRA_DATACENTER: datacenter1
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BROKERS: kafka:9092
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
      MAIL_USERNAME: noreply@medibook.com
      # Dev-only defaults keep this local Compose stack runnable even when the
      # caller's shell/IDE does not load the project root .env file. Override
      # both values for any shared, staging, or production-like environment.
      JWT_SECRET: ${JWT_SECRET:-medibook-local-dev-jwt-secret-change-before-shared-use-64-bytes-minimum}
      PHI_ENCRYPTION_KEY: ${PHI_ENCRYPTION_KEY:-medibook-local-dev-phi-encryption-key}
      # ─── Monnify (disabled by default; override in .env for sandbox testing) ───
      MONNIFY_ENABLED: ${MONNIFY_ENABLED:-false}
      MONNIFY_API_KEY: ${MONNIFY_API_KEY:-}
      MONNIFY_SECRET_KEY: ${MONNIFY_SECRET_KEY:-}
      MONNIFY_CONTRACT_CODE: ${MONNIFY_CONTRACT_CODE:-}
      MONNIFY_BASE_URL: ${MONNIFY_BASE_URL:-https://sandbox.monnify.com}
      MONNIFY_REDIRECT_URL: ${MONNIFY_REDIRECT_URL:-http://localhost:3000/payment/callback}
    depends_on:
      mysql:
        condition: service_healthy
      cassandra-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - medibook-net
    restart: unless-stopped

  # ─── MySQL ────────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.2
    container_name: medibook-mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: medibook
      MYSQL_USER: medibook
      MYSQL_PASSWORD: medibook
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - medibook-net

  # ─── Cassandra ────────────────────────────────────────────────────────────
  cassandra:
    image: cassandra:4.1
    container_name: medibook-cassandra
    ports:
      - "9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: MediBookCluster
      CASSANDRA_DC: datacenter1
    volumes:
      - cassandra-data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe keyspaces' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - medibook-net

  cassandra-init:
    image: cassandra:4.1
    container_name: medibook-cassandra-init
    depends_on:
      cassandra:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - >
        cqlsh cassandra 9042 -e "CREATE KEYSPACE IF NOT EXISTS medibook
        WITH replication = {'class': 'SimpleStrategy', 'replication_factor': 1};"
    networks:
      - medibook-net

  # ─── Redis ────────────────────────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: medibook-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - medibook-net

  # ─── Zookeeper ────────────────────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: medibook-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - medibook-net

  # ─── Kafka ────────────────────────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: medibook-kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 30s
    depends_on:
      - zookeeper
    networks:
      - medibook-net

  # ─── Kafka UI ─────────────────────────────────────────────────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: medibook-kafka-ui
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: medibook
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      - kafka
    networks:
      - medibook-net

  # ─── MailHog (Dev email catcher) ──────────────────────────────────────────
  mailhog:
    image: mailhog/mailhog:latest
    container_name: medibook-mailhog
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    networks:
      - medibook-net

  # ─── Prometheus ──────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.1
    container_name: medibook-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    networks:
      - medibook-net
    depends_on:
      - app

  # ─── Grafana ─────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.2
    container_name: medibook-grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: medibook
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - medibook-net
    depends_on:
      - prometheus

volumes:
  mysql-data:
  cassandra-data:
  redis-data:
  prometheus-data:
  grafana-data:

networks:
  medibook-net:
    driver: bridge
